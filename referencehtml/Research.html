<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151713">
  <meta name="description" content="Research Galaxy — references and source material from Unmoved Studios.">
  <title>Research Galaxy — un.moved studios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--ink:#151713;--paper:#e9e4dc;--green:#193a2d;--acid:#d8f16a;--muted:#a9a69e;--line:rgba(233,228,220,.23);--mono:'DM Mono',monospace;--sans:'DM Sans',Arial,sans-serif;--display:'Oswald',Impact,sans-serif}
    *{box-sizing:border-box}html{min-height:100%;background:var(--ink)}body{min-height:100vh;margin:0;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--sans);-webkit-font-smoothing:antialiased}button,a{font:inherit}a{color:inherit}.page{position:relative;min-height:100vh;padding:clamp(22px,3vw,44px);isolation:isolate}.page:before{content:'';position:absolute;z-index:-2;inset:0;background:radial-gradient(circle at 18% 54%,rgba(233,228,220,.055),transparent 20%),radial-gradient(circle at 78% 22%,rgba(233,228,220,.045),transparent 16%),radial-gradient(circle at 65% 78%,rgba(25,58,45,.4),transparent 30%),var(--ink)}.page:after{content:'';position:absolute;z-index:-1;inset:0;opacity:.14;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E")}.site-nav{position:relative;z-index:20;min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:24px;color:var(--paper)}.brand{font-weight:800;letter-spacing:-.06em;text-decoration:none;font-size:20px}.brand small{display:block;font:10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--paper)}.nav-actions{display:flex;align-items:center;gap:14px}.nav-back{color:var(--paper);font:11px var(--mono);letter-spacing:.04em;text-decoration:none}.nav-back:hover{color:var(--paper)}.fullscreen-button{padding:10px 13px;border:1px solid var(--line);background:transparent;color:var(--paper);font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}.fullscreen-button:hover,.fullscreen-button:focus-visible{border-color:var(--paper);color:var(--paper)}.fullscreen-button:focus-visible,.research-node:focus-visible,.close-preview:focus-visible{outline:2px solid var(--paper);outline-offset:4px}.intro{position:absolute;z-index:5;top:clamp(110px,16vh,170px);left:clamp(22px,3vw,44px);pointer-events:none}.eyebrow{color:var(--paper);font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase}.intro h1{margin:12px 0 0;font:600 clamp(58px,8vw,118px)/.86 var(--display);letter-spacing:-.025em;text-transform:uppercase}.galaxy{position:absolute;inset:88px 0 52px}.research-node{position:absolute;z-index:3;width:max-content;max-width:150px;display:flex;align-items:center;gap:10px;border:0;padding:8px;background:transparent;color:var(--paper);text-align:left;cursor:pointer;transform:translate(-50%,-50%)}.research-node:nth-of-type(1){left:53%;top:23%}.research-node:nth-of-type(2){left:72%;top:18%}.research-node:nth-of-type(3){left:86%;top:33%}.research-node:nth-of-type(4){left:68%;top:43%}.research-node:nth-of-type(5){left:91%;top:58%}.research-node:nth-of-type(6){left:76%;top:69%}.research-node:nth-of-type(7){left:58%;top:73%}.research-node:nth-of-type(8){left:44%;top:58%}.research-node:nth-of-type(9){left:31%;top:72%}.research-node:nth-of-type(10){left:19%;top:58%}.research-node:nth-of-type(11){left:27%;top:38%}.research-node:nth-of-type(12){left:39%;top:29%}.research-node:nth-of-type(13){left:46%;top:46%}.research-node:nth-of-type(14){left:61%;top:56%}.research-node:nth-of-type(15){left:82%;top:82%}.research-node .dot{flex:none;width:12px;height:12px;border:1px solid var(--paper);border-radius:50%;background:var(--paper);box-shadow:0 0 8px 3px rgba(233,228,220,.52),0 0 24px 8px rgba(233,228,220,.2);animation:breathe 3.2s ease-in-out infinite}.research-node:nth-child(3n) .dot{animation-delay:-1.1s}.research-node:nth-child(4n) .dot{animation-delay:-2.2s}.research-node .label{font:10px var(--mono);letter-spacing:.04em;text-shadow:0 2px 10px var(--ink);opacity:.82}.research-node:hover .dot,.research-node[aria-pressed=true] .dot{width:15px;height:15px;box-shadow:0 0 12px 5px rgba(233,228,220,.75),0 0 38px 13px rgba(233,228,220,.3)}.research-node:hover .label,.research-node[aria-pressed=true] .label{opacity:1;color:var(--paper)}@keyframes breathe{0%,100%{opacity:.72;transform:scale(.82)}50%{opacity:1;transform:scale(1.12)}}.preview{position:absolute;z-index:30;left:50%;top:52%;width:min(760px,calc(100vw - 44px));height:min(620px,calc(100vh - 150px));transform:translate(-50%,-50%) scale(.96);display:none;flex-direction:column;border:1px solid rgba(233,228,220,.38);background:rgba(21,23,19,.96);box-shadow:0 28px 90px rgba(0,0,0,.48);opacity:0}.preview.is-open{display:flex;animation:pop .22s ease-out forwards}@keyframes pop{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}.preview-head{min-height:58px;padding:12px 14px 12px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}.preview-head span{font:600 20px var(--display);letter-spacing:.02em;text-transform:uppercase}.preview-kind{color:var(--paper)!important;font:10px var(--mono)!important}.close-preview{width:38px;height:38px;border:1px solid var(--line);background:transparent;color:var(--paper);cursor:pointer}.close-preview:hover{border-color:var(--paper);color:var(--paper)}.preview-content{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;background:#0d0f0c}.preview-content iframe,.preview-content img,.preview-content video{width:100%;height:100%;border:0;object-fit:contain}.preview-content iframe{background:#fff}.preview-link{min-height:48px;padding:14px 18px;border-top:1px solid var(--line);color:var(--paper);font:10px var(--mono);letter-spacing:.06em;text-decoration:none;text-transform:uppercase}.preview-link:hover{text-decoration:underline}.site-footer{position:absolute;z-index:10;right:clamp(22px,3vw,44px);bottom:clamp(18px,2.4vw,32px);left:clamp(22px,3vw,44px);display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:14px;border-top:1px solid var(--line);font:10px var(--mono);letter-spacing:.04em}.site-footer a{text-decoration:none}.site-footer a:hover{color:var(--paper);text-decoration:underline}.footer-links{display:flex;gap:22px}.fullscreen-active .page{padding:clamp(16px,2vw,30px)}
    @media(max-width:760px){body{overflow:auto}.page{min-height:100svh;padding:18px}.site-nav{min-height:64px;align-items:flex-start}.nav-actions{gap:9px;flex-wrap:wrap;justify-content:flex-end}.nav-back,.fullscreen-button{font-size:9px}.fullscreen-button{padding:9px}.intro{top:118px;left:18px}.intro h1{font-size:clamp(50px,15vw,78px)}.galaxy{inset:70px 0 90px;min-height:520px}.research-node{max-width:105px;gap:7px}.research-node .label{font-size:8px}.research-node .dot{width:10px;height:10px}.research-node:nth-of-type(1){left:50%;top:27%}.research-node:nth-of-type(2){left:77%;top:23%}.research-node:nth-of-type(3){left:86%;top:38%}.research-node:nth-of-type(4){left:68%;top:47%}.research-node:nth-of-type(5){left:91%;top:63%}.research-node:nth-of-type(6){left:72%;top:76%}.research-node:nth-of-type(7){left:50%;top:84%}.research-node:nth-of-type(8){left:31%;top:69%}.research-node:nth-of-type(9){left:16%;top:52%}.research-node:nth-of-type(10){left:24%;top:36%}.preview{position:fixed;height:min(650px,calc(100svh - 130px));width:calc(100vw - 24px)}.site-footer{position:relative;right:auto;bottom:auto;left:auto;margin-top:560px;flex-wrap:wrap}.footer-links{gap:14px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="page">
    <nav class="site-nav" aria-label="Research Galaxy navigation">
      <a class="brand" href="Landing.html#home">un.moved<small>studios</small></a>
      <div class="nav-actions">
        <a class="nav-back" href="Landing.html#studio">← Inside the studio ↗</a>
        <button class="fullscreen-button" id="fullscreenButton" type="button" aria-label="Enter full screen">Full screen ↗</button>
      </div>
    </nav>
    <section class="intro" aria-labelledby="pageTitle">
      <div class="eyebrow">A living collection</div><h1 id="pageTitle">Research<br>Galaxy</h1>
    </section>
    <section class="galaxy" role="group" aria-label="Research Galaxy">
      <button class="research-node" type="button" data-title="Field Notes 01" data-kind="link" data-src="https://example.com/research/field-notes-01" aria-pressed="false"><span class="dot"></span><span class="label">Field Notes 01</span></button>
      <button class="research-node" type="button" data-title="Archive Document 02" data-kind="pdf" data-src="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" aria-pressed="false"><span class="dot"></span><span class="label">Archive Document 02</span></button>
      <button class="research-node" type="button" data-title="Moving Image 03" data-kind="video" data-src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" aria-pressed="false"><span class="dot"></span><span class="label">Moving Image 03</span></button>
      <button class="research-node" type="button" data-title="Visual Reference 04" data-kind="image" data-src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&amp;fit=crop&amp;w=1400&amp;q=85" aria-pressed="false"><span class="dot"></span><span class="label">Visual Reference 04</span></button>
      <button class="research-node" type="button" data-title="Reading List 05" data-kind="link" data-src="https://example.com/research/reading-list-05" aria-pressed="false"><span class="dot"></span><span class="label">Reading List 05</span></button>
      <button class="research-node" type="button" data-title="Source Text 06" data-kind="pdf" data-src="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" aria-pressed="false"><span class="dot"></span><span class="label">Source Text 06</span></button>
      <button class="research-node" type="button" data-title="Interview Clip 07" data-kind="video" data-src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" aria-pressed="false"><span class="dot"></span><span class="label">Interview Clip 07</span></button>
      <button class="research-node" type="button" data-title="Photographic Study 08" data-kind="image" data-src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&amp;fit=crop&amp;w=1400&amp;q=85" aria-pressed="false"><span class="dot"></span><span class="label">Photographic Study 08</span></button>
      <button class="research-node" type="button" data-title="External Resource 09" data-kind="link" data-src="https://example.com/research/external-resource-09" aria-pressed="false"><span class="dot"></span><span class="label">External Resource 09</span></button>
      <button class="research-node" type="button" data-title="Research Paper 10" data-kind="pdf" data-src="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" aria-pressed="false"><span class="dot"></span><span class="label">Research Paper 10</span></button>
      <button class="research-node" type="button" data-title="Footage Study 11" data-kind="video" data-src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" aria-pressed="false"><span class="dot"></span><span class="label">Footage Study 11</span></button>
      <button class="research-node" type="button" data-title="Image Reference 12" data-kind="image" data-src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&amp;fit=crop&amp;w=1400&amp;q=85" aria-pressed="false"><span class="dot"></span><span class="label">Image Reference 12</span></button>
      <button class="research-node" type="button" data-title="Project Link 13" data-kind="link" data-src="https://example.com/research/project-link-13" aria-pressed="false"><span class="dot"></span><span class="label">Project Link 13</span></button>
      <button class="research-node" type="button" data-title="Digitized Archive 14" data-kind="pdf" data-src="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" aria-pressed="false"><span class="dot"></span><span class="label">Digitized Archive 14</span></button>
      <button class="research-node" type="button" data-title="Motion Reference 15" data-kind="video" data-src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" aria-pressed="false"><span class="dot"></span><span class="label">Motion Reference 15</span></button>
    </section>
    <aside class="preview" id="preview" role="dialog" aria-modal="false" aria-label="Research item preview">
      <div class="preview-head"><span id="previewTitle">Research item</span><div style="display:flex;align-items:center;gap:10px"><span class="preview-kind" id="previewKind"></span><button class="close-preview" id="closePreview" type="button" aria-label="Close preview">×</button></div></div>
      <div class="preview-content" id="previewContent"></div>
      <a class="preview-link" id="previewLink" href="#" target="_blank" rel="noopener noreferrer" hidden>Open item in new tab ↗</a>
    </aside>
    <footer class="site-footer"><span>Unmoved Studios © 2026</span><div class="footer-links"><a href="Landing.html#studio">Inside the studio ↗</a><a href="mailto:info@unmovedstudios.com">Get in touch</a></div></footer>
  </main>
  <script>
    (()=>{
      const nodes=[...document.querySelectorAll('.research-node')],preview=document.querySelector('#preview'),content=document.querySelector('#previewContent'),title=document.querySelector('#previewTitle'),kindLabel=document.querySelector('#previewKind'),link=document.querySelector('#previewLink');
      const close=()=>{preview.classList.remove('is-open');nodes.forEach(node=>node.setAttribute('aria-pressed','false'))};
      const show=node=>{const {title:itemTitle,kind,src}=node.dataset;nodes.forEach(item=>item.setAttribute('aria-pressed',String(item===node)));title.textContent=itemTitle;kindLabel.textContent=kind;content.replaceChildren();link.href=src;link.hidden=false;
        if(kind==='image'){const image=document.createElement('img');image.src=src;image.alt=itemTitle;content.append(image)}
        else if(kind==='video'){const video=document.createElement('video');video.src=src;video.controls=true;video.playsInline=true;video.preload='metadata';video.setAttribute('aria-label',itemTitle);content.append(video)}
        else{const iframe=document.createElement('iframe');iframe.src=src;iframe.title=itemTitle;iframe.loading='lazy';iframe.referrerPolicy='strict-origin-when-cross-origin';content.append(iframe)}
        link.textContent=kind==='link'?'Open link in new tab ↗':`Open ${kind} in new tab ↗`;preview.classList.add('is-open')};
      nodes.forEach(node=>node.addEventListener('click',()=>show(node)));document.querySelector('#closePreview').addEventListener('click',close);document.addEventListener('keydown',event=>{if(event.key==='Escape')close()});
      const button=document.querySelector('#fullscreenButton');const update=()=>{const active=Boolean(document.fullscreenElement);button.textContent=active?'Exit full screen ↙':'Full screen ↗';button.setAttribute('aria-label',active?'Exit full screen':'Enter full screen');document.body.classList.toggle('fullscreen-active',active)};
      button.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(error){button.textContent='Full screen unavailable'}});document.addEventListener('fullscreenchange',update);
    })();
  </script>
</body>
</html>
